<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:with="pageTitle='Zones de Livraison'">
<head th:replace="~{layout/head :: head(pageTitle=${pageTitle})}"></head>
<body>

<div class="app">
  <aside th:replace="~{layout/sidebar :: sidebar(activeMenu='zones-livraison')}"></aside>

  <div class="main">
    <div th:replace="~{layout/navbar :: topbar(pageTitle=${pageTitle})}"></div>

    <div class="content">
      <div class="page-header">
        <div>
          <h2>Zones de Livraison</h2>
          <div class="breadcrumb">Accueil / <span>Zones de Livraison</span></div>
        </div>
        <a th:href="@{/zones-livraison/creer}" class="btn btn-primary">
          <i class="bi bi-plus-lg"></i> Ajouter une Zone
        </a>
        <div class="card mb-4">
          <div class="card-body">
              <h5 class="mb-3">
                  Import / Export Excel
              </h5>
              <div th:replace="~{fragments/excel-actions :: excelActions(
                  '/import/zones-livraison',
                  '/export/zones-livraison',
                  '/template_exel/zones-livraison/template_import_zones_livraison.xlsx'
              )}">
              </div>
          </div>
      </div>
      </div>

      <div th:replace="~{fragments/alerts :: flash}"></div>

      <form th:action="@{/zones-livraison}" method="get" th:object="${filter}" class="toolbar">
        <div class="toolbar-left">
          <div class="search-box">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" th:field="*{search}" autocomplete="off" placeholder="Rechercher par libellé…"/>
          </div>
          <button type="submit" class="btn btn-secondary btn-sm">Filtrer</button>
          <a th:href="@{/zones-livraison}" class="btn btn-outline-secondary btn-sm">Tout</a>
        </div>
      </form>

      <div class="table-card mb-4">
        <table class="data-table">
          <thead>
            <tr>
              <th><a th:href="${@pageLinks.sortUrl(request, 'id')}">ID ↕</a></th>
              <th><a th:href="${@pageLinks.sortUrl(request, 'libelle')}">Libellé ↕</a></th>
              <th><a th:href="${@pageLinks.sortUrl(request, 'min')}">Distance Min (km) ↕</a></th>
              <th><a th:href="${@pageLinks.sortUrl(request, 'max')}">Distance Max (km) ↕</a></th>
              <th><a th:href="${@pageLinks.sortUrl(request, 'prix')}">Prix (Ar) ↕</a></th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="z : ${page.content}">
              <td th:text="${z.id}">1</td>
              <td class="fw-bold" th:text="${z.libelle}">Zone A</td>
              <td th:text="${z.min}">0.000</td>
              <td th:text="${z.max}">5.000</td>
              <td th:text="${#numbers.formatDecimal(z.prix, 1, 'POINT', 2, 'COMMA')} + ' Ar'">5,00 Ar</td>
              <td class="actions text-center">
                <a th:href="@{/zones-livraison/modifier/{id}(id=${z.id})}" class="btn btn-warning btn-sm">
                  <i class="bi bi-pencil"></i> Modifier
                </a>
                <form th:action="@{/zones-livraison/supprimer/{id}(id=${z.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Confirmer la suppression ?');">
                  <button type="submit" class="btn btn-danger btn-sm">
                    <i class="bi bi-trash"></i> Supprimer
                  </button>
                </form>
              </td>
            </tr>
            <tr th:if="${page == null or #lists.isEmpty(page.content)}">
              <td colspan="6" class="text-center text-muted py-4">Aucune zone de livraison trouvée.</td>
            </tr>
          </tbody>
        </table>
        <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
<th:block th:replace="~{layout/scripts :: scripts}"></th:block>
</body>
</html>
