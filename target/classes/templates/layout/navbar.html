<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="topbar(pageTitle)" class="topbar">
  <button type="button" class="icon-btn menu-toggle" id="sidebarToggle" aria-label="Ouvrir le menu">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <div class="topbar-title" th:text="${pageTitle}">Titre de la page</div>
  <div class="topbar-search d-none d-md-flex">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" placeholder="Rechercher…" />
  </div>
  <div class="topbar-actions">
    <a class="icon-btn notification-link" th:href="@{/ingredients/manquants}" aria-label="Voir les alertes de stock" title="Alertes de stock">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="notif-dot" th:if="${nombreAlertesStock > 0}"></span>
      <span class="notif-count" th:if="${nombreAlertesStock > 0}" th:text="${nombreAlertesStock}">0</span>
    </a>
  </div>
</div>

</body>
</html>
