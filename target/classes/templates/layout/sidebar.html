<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<th:block th:fragment="sidebar(activeMenu)">
<aside class="sidebar" id="appSidebar">
  <div class="sidebar-brand">
    <div class="logo-icon">
      <img th:src="@{/img/favicon.svg}" alt="" width="22" height="22"/>
    </div>
    <div>
      <div class="brand-name">Maman Tsara</div>
      <div class="brand-sub">Nosy Be</div>
    </div>
    <button type="button" class="icon-btn sidebar-close" id="sidebarClose" aria-label="Fermer le menu">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    <div class="sidebar-section">Navigation</div>
    <a th:href="@{/dashboard}" class="nav-item" th:classappend="${activeMenu == 'dashboard'} ? 'active'">
      <svg viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
      Tableau de bord
    </a>

    <div class="sidebar-section">Gestion Restaurant</div>
    <a th:href="@{/commandes}" class="nav-item" th:classappend="${activeMenu == 'commandes'} ? 'active'">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Commandes
    </a>
    <a th:href="@{/plats}" class="nav-item" th:classappend="${activeMenu == 'plats'} ? 'active'">
      <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Plats &amp; Menus
    </a>
    <a th:href="@{/ingredients}" class="nav-item" th:classappend="${activeMenu == 'ingredients'} ? 'active'">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Ingrédients
    </a>
    <a th:href="@{/ingredients/stock}" class="nav-item" th:classappend="${activeMenu == 'stocks'} ? 'active'">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Stocks
    </a>
    <a th:href="@{/ingredients/manquants}" class="nav-item" th:classappend="${activeMenu == 'ingredients-manquants'} ? 'active'">
      <svg viewBox="0 0 24 24"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      Ingrédients manquants
    </a>
    <a th:href="@{/materielles}" class="nav-item" th:classappend="${activeMenu == 'materielles'} ? 'active'">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6v6H9z"/></svg>
      Matériels
    </a>
    <a th:href="@{/caisse}" class="nav-item" th:classappend="${activeMenu == 'caisse'} ? 'active'">
      <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Caisse
    </a>

    <div class="sidebar-section">Acteurs</div>
    <a th:href="@{/clients}" class="nav-item" th:classappend="${activeMenu == 'clients'} ? 'active'">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      Clients
    </a>
    <a th:href="@{/fournisseurs}" class="nav-item" th:classappend="${activeMenu == 'fournisseurs'} ? 'active'">
      <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Fournisseurs
    </a>
    <a th:href="@{/personnels}" class="nav-item" th:classappend="${activeMenu == 'personnels'} ? 'active'">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
      Personnels
    </a>
    <a th:href="@{/zones-livraison}" class="nav-item" th:classappend="${activeMenu == 'zones-livraison'} ? 'active'">
      <svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13" rx="2" ry="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      Zones de Livraison
    </a>
  </nav>

  <div class="sidebar-bottom" sec:authorize="isAuthenticated()">
    <div class="user-row">
      <div class="avatar"
           th:with="uname=${#authentication.name}"
           th:text="${uname != null and !#strings.isEmpty(uname) ? #strings.toUpperCase(#strings.substring(uname,0,1)) : 'A'}">A</div>
      <div class="user-info">
        <div class="name" sec:authentication="name">Admin</div>
        <div class="role">Gestionnaire</div>
      </div>
    </div>
    <form th:action="@{/logout}" method="post" class="mt-2">
      <button type="submit" class="btn btn-sm btn-outline-light w-100">Déconnexion</button>
    </form>
  </div>
</aside>
<div id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true"></div>
</th:block>

</body>
</html>
