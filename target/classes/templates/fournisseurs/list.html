<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{layout/head :: head(pageTitle='Fournisseurs')}"></head>
<body>

<div class="app">
  <aside th:replace="~{layout/sidebar :: sidebar(activeMenu='fournisseurs')}"></aside>

  <div class="main">
    <div th:replace="~{layout/navbar :: topbar(pageTitle='Fournisseurs')}"></div>

    <div class="content">
      <div class="page-header">
        <div>
          <h2>Gestion des Fournisseurs</h2>
          <div class="breadcrumb">Accueil / <span>Fournisseurs</span></div>
        </div>
        <a th:href="@{/fournisseurs/new}" class="btn btn-primary">+ Nouveau Fournisseur</a>
      </div>

      <div th:replace="~{fragments/alerts :: flash}"></div>

      <div class="table-card">
        <table>
          <thead>
            <tr><th>ID</th><th>Nom</th><th>Prénom</th><th>Contact</th><th>Type</th><th>Actions</th></tr>
          </thead>
          <tbody>
            <tr th:each="f : ${page.content}">
              <td th:text="${f.id}">1</td>
              <td th:text="${f.nom}">Nom</td>
              <td th:text="${f.prenom}">Prénom</td>
              <td th:text="${f.contact}">0340000000</td>
              <td th:text="${f.typeFournisseurs != null ? f.typeFournisseurs.libelle : 'N/A'}">Type</td>
              <td class="td-actions">
                <a th:href="@{/fournisseurs/edit/{id}(id=${f.id})}" class="action-btn" title="Modifier">
                  <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </a>
                <form th:action="@{/fournisseurs/delete/{id}(id=${f.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Confirmer la suppression ?');">
                  <button type="submit" class="action-btn del" title="Supprimer">
                    <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                  </button>
                </form>
              </td>
            </tr>
            <tr th:if="${page == null or #lists.isEmpty(page.content)}">
              <td colspan="6" style="text-align:center; color: var(--c-muted); padding: 24px;">Aucun fournisseur enregistré</td>
            </tr>
          </tbody>
        </table>
        <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
<th:block th:replace="~{layout/scripts :: scripts}"></th:block>

</body>
</html>
