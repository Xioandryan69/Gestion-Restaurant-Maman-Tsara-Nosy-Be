<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:with="pageTitle=${commandeDto.id == null ? 'Nouvelle Commande' : 'Modifier Commande'}">
<head th:replace="~{layout/head :: head(pageTitle=${pageTitle})}"></head>
<body>

<div class="app">

  <!-- Sidebar globale -->
  <aside th:replace="~{layout/sidebar :: sidebar(activeMenu='commandes')}"></aside>

  <!-- Conteneur principal -->
  <div class="main">

    <!-- Topbar globale -->
    <div th:replace="~{layout/navbar :: topbar(pageTitle=${pageTitle})}"></div>

    <!-- Contenu de la page -->
    <div class="content">

      <!-- En-tête de la page -->
      <div class="page-header">
        <div>
          <h2 th:text="${commandeDto.id == null ? 'Nouvelle Commande' : 'Modifier Commande # ' + commandeDto.id}">
            Formulaire Commande
          </h2>
          <div class="breadcrumb">
            Accueil / <a th:href="@{/commandes}">Commandes</a> / 
            <span th:text="${commandeDto.id == null ? 'Nouvelle' : 'Édition'}">Saisie</span>
          </div>
        </div>
        <a th:href="@{/commandes}" class="btn btn-secondary">&larr; Annuler</a>
      </div>

      <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
      <div th:if="${ingredientsManquants}" class="table-card mb-4">
        <div class="p-3"><h4 class="text-danger mb-3">Ingrédients insuffisants</h4>
          <div class="table-responsive"><table class="data-table"><thead><tr><th>Ingrédient</th><th>Quantité requise</th><th>Stock actuel</th><th>Quantité manquante</th><th></th></tr></thead><tbody>
            <tr th:each="item : ${ingredientsManquants}"><td class="fw-bold" th:text="${item.nom + ' (' + item.unite + ')'}">Riz</td><td th:text="${item.quantiteRequise}">10</td><td th:text="${item.quantiteActuelle}">2</td><td class="text-danger fw-bold" th:text="${item.quantiteManquante}">8</td><td><a class="btn btn-primary btn-sm" th:href="@{/ingredients/{id}/detail(id=${item.id},quantite=${item.quantiteManquante},retour='commande')}">Ajouter</a></td></tr>
          </tbody></table></div>
        </div>
      </div>

      <form th:action="@{/commandes/save}" th:object="${commandeDto}" method="post" id="commandeForm">
        <input type="hidden" th:field="*{id}" />

        <!-- En-tête de Commande -->
        <div class="form-card mb-4">
          <h3 class="text-primary mb-3">Informations de la Commande</h3>
          
          <div class="form-grid">
            
            <div class="field-group">
              <label class="field-label">Client <span class="required">*</span></label>
              <select class="form-control" th:field="*{idClient}" required>
                <option value="">-- Sélectionner un client --</option>
                <option th:each="c : ${clients}" 
                        th:value="${c.id}" 
                        th:text="${c.nom + (c.prenom != null ? ' ' + c.prenom : '')}">
                </option>
              </select>
            </div>

            <div class="field-group">
              <label class="field-label">Zone de Livraison <span class="required">*</span></label>
              <select class="form-control" th:field="*{idZoneLivraison}" required>
                <option value="">-- Sélectionner une zone --</option>
                <option th:each="z : ${zones}" 
                        th:value="${z.id}" 
                        th:text="${z.libelle + (z.prix != null ? ' (' + #numbers.formatDecimal(z.prix, 1, 'POINT', 2, 'COMMA') + ' Ar)' : '')}">
                </option>
              </select>
            </div>

            <div class="field-group">
              <label class="field-label">Date de Commande <span class="required">*</span></label>
              <input type="date" class="form-control" th:field="*{dateCommande}" required />
            </div>

          </div>
        </div>

        <!-- Section Plats Commandés -->
        <div class="table-card mb-4 p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="m-0 text-secondary">Plats Commandés</h3>
            <button type="button" class="btn btn-secondary btn-sm" id="btnAddPlat">
              <i class="bi bi-plus-circle"></i> Ajouter un plat
            </button>
          </div>

          <div class="table-responsive">
            <table class="data-table" id="tablePlats">
              <thead>
                <tr>
                  <th style="width: 55%;">Plat</th>
                  <th style="width: 30%;">Quantité</th>
                  <th style="width: 15%;" class="text-center">Action</th>
                </tr>
              </thead>
              <tbody id="lignesContainer">
                <tr th:each="ligne, stat : *{lignes}" class="ligne-plat-row">
                  <td>
                    <div class="plat-autocomplete">
                      <input type="text" class="form-control plat-search" placeholder="Rechercher un plat…" autocomplete="off" />
                      <input type="hidden" class="plat-select" th:field="*{lignes[__${stat.index}__].idPlat}" />
                      <ul class="autocomplete-list"></ul>
                    </div>
                  </td>
                  <td>
                    <input type="number" step="0.01" min="0.01" class="form-control plat-qty" 
                           th:field="*{lignes[__${stat.index}__].quantite}" required />
                  </td>
                  <td class="text-center">
                    <button type="button" class="btn btn-danger btn-sm remove-ligne" title="Supprimer">
                      <i class="bi bi-trash"></i>
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Barre d'actions -->
        <div class="toolbar d-flex justify-content-end gap-2 mb-4">
          <a th:href="@{/commandes}" class="btn btn-secondary">Annuler</a>
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-circle"></i> Enregistrer la commande
          </button>
        </div>

      </form>

    </div>
  </div>

</div>

<div th:replace="~{layout/footer :: footer}"></div>
<th:block th:replace="~{layout/scripts :: scripts}"></th:block>

<!-- Styles pour l'autocomplete du champ Plat -->
<style>
.plat-autocomplete { position: relative; }
.plat-autocomplete .plat-search { width: 100%; font-size: 16px; }
.plat-autocomplete .plat-search.is-invalid { border-color: #dc3545; }

.autocomplete-list {
  position: absolute;
  z-index: 50;
  top: 100%;
  left: 0;
  right: 0;
  margin-top: 2px;
  padding: 4px 0;
  background: #fff;
  border: 1px solid #d0d5dd;
  border-radius: 6px;
  max-height: 220px;
  overflow-y: auto;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
  list-style: none;
  display: none;
}
.autocomplete-list.open { display: block; }
.autocomplete-list li { padding: 8px 12px; cursor: pointer; font-size: .9rem; }
.autocomplete-list li:hover, .autocomplete-list li.active { background: #f1f3f5; }
.autocomplete-list li.no-result { color: #888; cursor: default; }

@media (max-width: 768px) {
  .autocomplete-list li { padding: 12px 14px; font-size: 1rem; }
}
</style>

<!-- Logic JavaScript d'ajout/suppression dynamique avec réindexation -->
<script th:inline="javascript">
document.addEventListener("DOMContentLoaded", function() {
    const platsList = /*[[${plats}]]*/ [];
    const container = document.getElementById("lignesContainer");
    const btnAdd = document.getElementById("btnAddPlat");
    const form = document.getElementById("commandeForm");

    function formatNumber(num) {
        if (!num) return "0,00";
        return new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num);
    }

    function platLabel(p) {
        const prixStr = p.prixVente != null ? ` - ${formatNumber(p.prixVente)} Ar` : '';
        return `${p.nom}${prixStr}`;
    }

    function findPlat(id) {
        return platsList.find(p => String(p.id) === String(id));
    }

    function initAutocomplete(wrapper) {
        const searchInput = wrapper.querySelector(".plat-search");
        const hiddenInput = wrapper.querySelector(".plat-select");
        const list = wrapper.querySelector(".autocomplete-list");

        const preselected = findPlat(hiddenInput.value);
        if (preselected) searchInput.value = platLabel(preselected);

        function closeList() {
            list.classList.remove("open");
            list.innerHTML = "";
        }

        function selectPlat(p) {
            hiddenInput.value = p.id;
            searchInput.value = platLabel(p);
            searchInput.classList.remove("is-invalid");
            closeList();
        }

        function renderList(showAll) {
            const q = showAll ? "" : searchInput.value.trim().toLowerCase();
            const matches = platsList.filter(p => p.nom.toLowerCase().includes(q));
            list.innerHTML = "";
            if (matches.length === 0) {
                list.innerHTML = '<li class="no-result">Aucun plat trouvé</li>';
            } else {
                matches.slice(0, 50).forEach(p => {
                    const li = document.createElement("li");
                    li.textContent = platLabel(p);
                    li.addEventListener("mousedown", (e) => {
                        e.preventDefault(); // évite que le blur ferme la liste avant le clic
                        selectPlat(p);
                    });
                    list.appendChild(li);
                });
            }
            list.classList.add("open");
        }

        searchInput.addEventListener("focus", () => renderList(true));
        searchInput.addEventListener("input", () => {
            hiddenInput.value = "";
            renderList(false);
        });
        searchInput.addEventListener("blur", () => {
            setTimeout(() => {
                closeList();
                const selected = findPlat(hiddenInput.value);
                searchInput.value = selected ? platLabel(selected) : "";
                searchInput.classList.toggle("is-invalid", !selected);
            }, 150);
        });
        searchInput.addEventListener("keydown", (e) => {
            const items = Array.from(list.querySelectorAll("li:not(.no-result)"));
            let idx = items.findIndex(li => li.classList.contains("active"));
            if (e.key === "ArrowDown") {
                e.preventDefault();
                idx = Math.min(idx + 1, items.length - 1);
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                idx = Math.max(idx - 1, 0);
            } else if (e.key === "Enter") {
                e.preventDefault();
                if (idx >= 0 && items[idx]) items[idx].dispatchEvent(new Event("mousedown"));
                return;
            } else if (e.key === "Escape") {
                closeList();
                return;
            } else {
                return;
            }
            items.forEach(li => li.classList.remove("active"));
            if (items[idx]) {
                items[idx].classList.add("active");
                items[idx].scrollIntoView({ block: "nearest" });
            }
        });
    }

    function updateRowIndices() {
        const rows = container.querySelectorAll(".ligne-plat-row");
        rows.forEach((row, index) => {
            const hidden = row.querySelector(".plat-select");
            const input = row.querySelector(".plat-qty");

            hidden.name = `lignes[${index}].idPlat`;
            input.name = `lignes[${index}].quantite`;
        });
    }

    function ajouterLigne() {
        const index = container.querySelectorAll(".ligne-plat-row").length;
        const tr = document.createElement("tr");
        tr.className = "ligne-plat-row";

        tr.innerHTML = `
            <td>
                <div class="plat-autocomplete">
                    <input type="text" class="form-control plat-search" placeholder="Rechercher un plat…" autocomplete="off" />
                    <input type="hidden" name="lignes[${index}].idPlat" class="plat-select" />
                    <ul class="autocomplete-list"></ul>
                </div>
            </td>
            <td>
                <input type="number" step="0.01" min="0.01" name="lignes[${index}].quantite" value="1" class="form-control plat-qty" required />
            </td>
            <td class="text-center">
                <button type="button" class="btn btn-danger btn-sm remove-ligne" title="Supprimer">
                    <i class="bi bi-trash"></i> Supprimer
                </button>
            </td>
        `;

        container.appendChild(tr);
        initAutocomplete(tr.querySelector(".plat-autocomplete"));
        updateRowIndices();
    }

    btnAdd.addEventListener("click", ajouterLigne);

    container.addEventListener("click", function(e) {
        if (e.target.closest(".remove-ligne")) {
            const row = e.target.closest(".ligne-plat-row");
            row.remove();
            updateRowIndices();
        }
    });

    // Validation avant soumission : chaque ligne doit avoir un plat sélectionné
    form.addEventListener("submit", function(e) {
        let valid = true;
        container.querySelectorAll(".ligne-plat-row").forEach(row => {
            const hidden = row.querySelector(".plat-select");
            const search = row.querySelector(".plat-search");
            if (!hidden.value) {
                valid = false;
                search.classList.add("is-invalid");
            }
        });
        if (!valid) e.preventDefault();
    });

    // Initialise les lignes déjà présentes au chargement (mode édition) et les index de départ
    container.querySelectorAll(".plat-autocomplete").forEach(initAutocomplete);
    updateRowIndices();
});
</script>

</body>
</html>
