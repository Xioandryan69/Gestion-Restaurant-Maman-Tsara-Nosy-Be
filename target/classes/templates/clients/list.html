<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:with="pageTitle='Gestion des Clients — Maman Tsara'">
<head th:replace="~{layout/head :: head(pageTitle=${pageTitle})}"></head>
<body>

<div class="app">

  <!-- Sidebar globale avec l'onglet 'clients' actif -->
  <aside th:replace="~{layout/sidebar :: sidebar(activeMenu='clients')}"></aside>

  <!-- Conteneur principal -->
  <div class="main">

    <!-- Topbar globale -->
    <div th:replace="~{layout/navbar :: topbar(pageTitle=${pageTitle})}"></div>

    <!-- Contenu de la page -->
    <div class="content">

      <!-- En-tête de la page -->
      <div class="page-header">
        <div>
          <h2>Clients</h2>
          <div class="breadcrumb">Accueil / <span>Clients</span></div>
        </div>
        <a th:href="@{/clients/new}" class="btn btn-primary">
          <i class="bi bi-plus-lg"></i> Nouveau Client
        </a>

        <div class="card mb-4">
    <div class="card-body">

        <h5 class="mb-3">
            Import / Export Excel
        </h5>

        <div th:replace="~{fragments/excel-actions :: excelActions(
            '/import/clients',
            '/export/clients',
            '/template_exel/clients/template_import_clients.xlsx'
        )}">
        </div>

    </div>
</div>
      </div>

      <div th:replace="~{fragments/alerts :: flash}"></div>

      <div class="card mb-4 shadow-sm"><div class="card-body">
        <form th:action="@{/clients}" th:object="${criteria}" method="get" class="row g-3 align-items-end">
          <div class="col-md-3"><label class="form-label">Nom</label><input th:field="*{nom}" list="clientNomSuggestions" autocomplete="off" class="form-control" placeholder="Nom"><datalist id="clientNomSuggestions"><option th:each="client : ${page.content}" th:value="${client.nom}"></option></datalist></div>
          <div class="col-md-3"><label class="form-label">Prénom</label><input th:field="*{prenom}" class="form-control" placeholder="Prénom"></div>
          <div class="col-md-3"><label class="form-label">Contact</label><input th:field="*{contact}" class="form-control" placeholder="Téléphone"></div>
          <div class="col-md-3"><label class="form-label">Type</label><select th:field="*{idTypeClient}" class="form-select"><option value="">Tous les types</option><option th:each="type : ${typesClient}" th:value="${type.id}" th:text="${type.libelle}"></option></select></div>
          <div class="col-md-3 d-flex gap-2"><button class="btn btn-secondary">Filtrer</button><a th:href="@{/clients}" class="btn btn-outline-secondary">Tout</a></div>
        </form>
      </div></div>

      <!-- Tableau des résultats -->
      <div class="table-card mb-4">
        <table class="data-table">
          <thead>
            <tr>
              <th><a th:href="${@pageLinks.sortUrl(request, 'id')}">ID ↕</a></th>
              <th><a th:href="${@pageLinks.sortUrl(request, 'nom')}">Nom ↕</a></th>
              <th><a th:href="${@pageLinks.sortUrl(request, 'prenom')}">Prénom ↕</a></th>
              <th><a th:href="${@pageLinks.sortUrl(request, 'contact')}">Contact ↕</a></th>
              <th><a th:href="${@pageLinks.sortUrl(request, 'typeClient.libelle')}">Type ↕</a></th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="client : ${page.content}">
              <td th:text="${client.id}">1</td>
              <td class="fw-bold" th:text="${client.nom}">Nom</td>
              <td th:text="${client.prenom != null ? client.prenom : '-'}">Prénom</td>
              <td th:text="${client.contact != null ? client.contact : '-'}">Contact</td>
              <td>
                <span class="badge bg-info text-dark" 
                      th:text="${client.typeClientLibelle != null ? client.typeClientLibelle : 'Standard'}">
                  Standard
                </span>
              </td>
              <td class="actions text-center">
                <a th:href="@{/clients/edit/{id}(id=${client.id})}" class="btn btn-warning btn-sm" title="Modifier">
                  <i class="bi bi-pencil"></i> Modifier
                </a>
                <form th:action="@{/clients/delete/{id}(id=${client.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Supprimer ce client ?');">
                  <button type="submit" class="btn btn-danger btn-sm" title="Supprimer">
                    <i class="bi bi-trash"></i> Supprimer
                  </button>
                </form>
              </td>
            </tr>
            <tr th:if="${page == null or #lists.isEmpty(page.content)}">
              <td colspan="6" class="text-center text-muted py-4">Aucun client trouvé.</td>
            </tr>
          </tbody>
        </table>
        <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
      </div>

    </div>
  </div>

</div>

<div th:replace="~{layout/footer :: footer}"></div>
<th:block th:replace="~{layout/scripts :: scripts}"></th:block>

</body>
</html>
