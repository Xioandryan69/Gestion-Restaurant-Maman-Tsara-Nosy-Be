<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:with="pageTitle=${ingredient.id == null ? 'Nouveau Matériel' : 'Modifier Ingrédient'}">
<head th:replace="~{layout/head :: head(pageTitle=${pageTitle})}">
    <!-- Viewport pour l'adaptation mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<!-- CSS d'adaptation responsive -->
<style>
    body, .app {
        overflow-x: hidden;
    }

    .app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }
    
    @media (min-width: 768px) {
        .app {
            flex-direction: row;
        }
        .main {
            flex: 1;
            min-width: 0;
        }
    }

    .content {
        padding: 15px;
    }
    @media (min-width: 768px) {
        .content {
            padding: 25px;
        }
    }

    /* Grille adaptative (1 col sur mobile, 2 cols sur PC) */
    .form-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
        margin-bottom: 1rem;
    }
    @media (min-width: 768px) {
        .form-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    /* Adapter la barre d'actions sur mobile */
    @media (max-width: 576px) {
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .toolbar .btn {
            width: 100%;
        }
    }
</style>

<div class="app container-fluid p-0">

  <!-- Sidebar globale -->
  <aside th:replace="~{layout/sidebar :: sidebar(activeMenu='ingredients')}"></aside>

  <!-- Conteneur principal -->
  <div class="main w-100">

    <!-- Topbar globale -->
    <div th:replace="~{layout/navbar :: topbar(pageTitle=${pageTitle})}"></div>

    <!-- Contenu de la page -->
    <div class="content">

      <div class="page-header d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
        <div>
          <h2 class="h3 mb-1" th:text="${ingredient.id == null ? 'Ajouter un Ingrédient' : 'Modifier l''Ingrédient'}"></h2>
          <div class="breadcrumb mb-0">Accueil / <a th:href="@{/ingredients}">Ingrédients</a> / <span>Formulaire</span></div>
        </div>
      </div>

      <div class="form-card card shadow-sm p-3 p-md-4 mb-4">
        <form th:action="@{/ingredients/save}" th:object="${ingredient}" method="post">
          <input type="hidden" th:field="*{id}" />

          <!-- Champ Nom en pleine largeur -->
          <div class="form-grid mb-3">
            <div class="field-group" style="grid-column: 1 / -1;">
              <label class="field-label form-label">Nom de l'ingrédient <span class="required text-danger">*</span></label>
              <input type="text" th:field="*{nom}" class="form-control" placeholder="Ex: Farine, Huile..." required />
            </div>
          </div>

          <!-- Ligne 1 : Catégorie & Statut -->
          <div class="form-grid">
            <div class="field-group">
              <label class="field-label form-label">Catégorie <span class="required text-danger">*</span></label>
              <select th:field="*{idCategorie}" class="form-control form-select" required>
                <option value="">-- Sélectionner une catégorie --</option>
                <option th:each="cat : ${categories}" 
                        th:value="${cat.id}" 
                        th:text="${cat.libelle}"
                        th:selected="${ingredient.idCategorie != null and ingredient.idCategorie == cat.id}">
                </option>
              </select>
            </div>

            <div class="field-group">
              <label class="field-label form-label">Statut <span class="required text-danger">*</span></label>
              <select th:field="*{idStatut}" class="form-control form-select" required>
                <option value="">-- Sélectionner un statut --</option>
                <option th:each="st : ${statuts}" 
                        th:value="${st.id}" 
                        th:text="${st.libelle}"
                        th:selected="${ingredient.idStatut != null and ingredient.idStatut == st.id}">
                </option>
              </select>
            </div>
          </div>

          <!-- Ligne 2 : Fournisseur & Unité -->
          <div class="form-grid">
            <div class="field-group">
              <label class="field-label form-label">Fournisseur <span class="required text-danger">*</span></label>
              <select th:field="*{idFournisseur}" class="form-control form-select" required>
                <option value="">-- Sélectionner un fournisseur --</option>
                <option th:each="f : ${fournisseurs}" 
                        th:value="${f.id}" 
                        th:text="${f.nom + ' ' + f.prenom}"
                        th:selected="${ingredient.idFournisseur != null and ingredient.idFournisseur == f.id}">
                </option>
              </select>
            </div>

            <div class="field-group">
              <label class="field-label form-label">Unité de mesure <span class="required text-danger">*</span></label>
              <select th:field="*{idUnite}" class="form-control form-select" required>
                <option value="">-- Sélectionner une unité --</option>
                <option th:each="u : ${unites}" 
                        th:value="${u.id}" 
                        th:text="${u.nom + ' (' + u.symbole + ')'}"
                        th:selected="${ingredient.idUnite != null and ingredient.idUnite == u.id}">
                </option>
              </select>
            </div>
          </div>

          <!-- Actions -->
          <div class="toolbar d-flex justify-content-end gap-2 mt-4">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a th:href="@{/ingredients}" class="btn btn-secondary">Annuler</a>
          </div>

        </form>
      </div>

    </div>
  </div>

</div>

<div th:replace="~{layout/footer :: footer}"></div>
<th:block th:replace="~{layout/scripts :: scripts}"></th:block>

</body>
</html>
