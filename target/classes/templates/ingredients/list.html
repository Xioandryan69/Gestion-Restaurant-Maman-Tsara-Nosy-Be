<!-- FILE : src/main/resources/templates/ingredients/list.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:with="pageTitle=${'Liste des ingrédients'}">
<head th:replace="~{layout/head :: head(pageTitle=${pageTitle})}"></head>
<body>

    <div class="app">
        <!-- Sidebar globale avec l'onglet 'ingredients' actif -->
        <aside th:replace="~{layout/sidebar :: sidebar(activeMenu='ingredients')}"></aside>
        
        <div class="main">
            <!-- Topbar globale -->
            <div th:replace="~{layout/navbar :: topbar(pageTitle=${pageTitle})}"></div>

            <div class="content">
                <!-- En-tête de la page -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2>Ingrédients</h2>
                        <div class="breadcrumb">Accueil / <span>Ingrédients</span></div>
                    </div>
                    <div>
                        <a th:href="@{/ingredients/dashboard}" class="btn btn-outline-secondary me-2">Dashboard</a>
                        <a th:href="@{/ingredients/stock}" class="btn btn-outline-info me-2">État du Stock</a>
                        <a th:href="@{/ingredients/new}" class="btn btn-primary">+ Nouvel Ingrédient</a>
                    </div>
                </div>

                <!-- Section Import / Export Excel harmonisée avec le Fragment -->
                <div class="card mb-4 shadow-sm">
                    <div class="card-body">
                        <h5 class="mb-3">Import / Export Excel</h5>
                        <div th:replace="~{fragments/excel-actions :: excelActions(
                            '/import/ingredients',
                            '/export/ingredients',
                            '/template_exel/ingredients/template_import_ingredients.xlsx'
                        )}">
                        </div>
                    </div>
                </div>

                <!-- Messages Flash -->
                <div th:replace="~{fragments/alerts :: flash}"></div>

                <!-- Formulaire de recherche / filtrage -->
                <div class="card mb-4 shadow-sm">
                    <div class="card-body">
                        <form th:action="@{/ingredients}" method="get" th:object="${criteria}" class="row g-3">
                            <div class="col-md-4">
                                <input type="text" th:field="*{nom}" list="ingredientSuggestions" autocomplete="off" class="form-control" placeholder="Nom de l'ingrédient...">
                                <datalist id="ingredientSuggestions"><option th:each="ing : ${page.content}" th:value="${ing.nom}"></option></datalist>
                            </div>
                            <div class="col-md-3">
                                <select th:field="*{idCategorie}" class="form-select">
                                    <option value="">-- Catégorie --</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.libelle}"></option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <select th:field="*{idStatut}" class="form-select">
                                    <option value="">-- Statut --</option>
                                    <option th:each="st : ${statuts}" th:value="${st.id}" th:text="${st.libelle}"></option>
                                </select>
                            </div>
                            <div class="col-md-3"><select th:field="*{idFournisseur}" class="form-select"><option value="">Tous les fournisseurs</option><option th:each="f : ${fournisseurs}" th:value="${f.id}" th:text="${f.nom}"></option></select></div>
                            <div class="col-md-3"><select th:field="*{idUnite}" class="form-select"><option value="">Toutes les unités</option><option th:each="u : ${unites}" th:value="${u.id}" th:text="${u.nom}"></option></select></div>
                            <div class="col-md-2 d-flex gap-2">
                                <button type="submit" class="btn btn-secondary">Filtrer</button>
                                <a th:href="@{/ingredients}" class="btn btn-outline-secondary">Tout</a>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Table d'affichage -->
                <div class="table-responsive bg-white shadow-sm rounded">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th><a th:href="${@pageLinks.sortUrl(request, 'id')}">ID ↕</a></th>
                                <th><a th:href="${@pageLinks.sortUrl(request, 'nom')}">Nom ↕</a></th>
                                <th><a th:href="${@pageLinks.sortUrl(request, 'categorieIngredients.libelle')}">Catégorie ↕</a></th>
                                <th><a th:href="${@pageLinks.sortUrl(request, 'fournisseur.nom')}">Fournisseur ↕</a></th>
                                <th><a th:href="${@pageLinks.sortUrl(request, 'unite.nom')}">Unité ↕</a></th>
                                <th><a th:href="${@pageLinks.sortUrl(request, 'statutIngredient.libelle')}">Statut ↕</a></th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="ing : ${page.content}">
                                <td th:text="${ing.id}">1</td>
                                <td><strong th:text="${ing.nom}">Riz</strong></td>
                                <td th:text="${ing.categorieLibelle != null ? ing.categorieLibelle : '-'}">Céréales</td>
                                <td th:text="${ing.fournisseurNom != null ? ing.fournisseurNom : '-'}">Fournisseur A</td>
                                <td th:text="${ing.uniteNom != null ? ing.uniteNom + (ing.uniteSymbole != null ? ' (' + ing.uniteSymbole + ')' : '') : '-'}">Kg</td>
                                <td>
                                    <span class="badge bg-info" th:text="${ing.statutLibelle}">Disponible</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/ingredients/{id}/detail(id=${ing.id})}" class="btn btn-sm btn-outline-primary">Détail</a>
                                    <a th:href="@{/ingredients/edit/{id}(id=${ing.id})}" class="btn btn-sm btn-outline-warning">Éditer</a>
                                    <form th:action="@{/ingredients/delete/{id}(id=${ing.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('Supprimer cet ingrédient ?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${page == null or #lists.isEmpty(page.content)}">
                                <td colspan="7" class="text-center text-muted py-4">Aucun ingrédient trouvé.</td>
                            </tr>
                        </tbody>
                    </table>
                    <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout/footer :: footer}"></div>
    <th:block th:replace="~{layout/scripts :: scripts}"></th:block>

</body>
</html>
