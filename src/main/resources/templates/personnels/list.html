<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:with="pageTitle='Gestion du Personnel - Maman Tsara Nosy-Be'">
<head th:replace="~{layout/head :: head(pageTitle=${pageTitle})}"></head>
<body>

<div class="app">

  <!-- Sidebar globale avec l'onglet 'personnels' actif -->
  <aside th:replace="~{layout/sidebar :: sidebar(activeMenu='personnels')}"></aside>

  <!-- Conteneur principal -->
  <div class="main">

    <!-- Topbar globale -->
    <div th:replace="~{layout/navbar :: topbar(pageTitle=${pageTitle})}"></div>

    <!-- Contenu de la page -->
    <div class="content">

      <!-- En-tête de la page -->
      <div class="page-header">
        <div>
          <h2>Gestion du Personnel</h2>
          <div class="breadcrumb">Accueil / <span>Personnel</span></div>
        </div>
        <a th:href="@{/personnels/new}" class="btn btn-primary">
          <i class="bi bi-person-plus"></i> Nouvel Employé
        </a>
        <div class="card mb-4">
    <div class="card-body">

            <h5 class="mb-3">
                Import / Export Excel
            </h5>

            <div th:replace="~{fragments/excel-actions :: excelActions(
                '/import/personnels',
                '/export/personnels',
                '/template_exel/personnels/template_import_personnels_complet.xlsx'
            )}">
            </div>

        </div>
    </div>
      </div>

      <div th:replace="~{fragments/alerts :: flash}"></div>

      <div class="card mb-4 shadow-sm"><div class="card-body">
        <form th:action="@{/personnels}" th:object="${criteria}" method="get" class="row g-3 align-items-end">
          <div class="col-md-3"><label class="form-label">Nom</label><input th:field="*{nom}" list="personnelNomSuggestions" autocomplete="off" class="form-control" placeholder="Nom"><datalist id="personnelNomSuggestions"><option th:each="p : ${page.content}" th:value="${p.nom}"></option></datalist></div>
          <div class="col-md-3"><label class="form-label">Prénom</label><input th:field="*{prenom}" class="form-control" placeholder="Prénom"></div>
          <div class="col-md-3"><label class="form-label">Contact</label><input th:field="*{contact}" class="form-control" placeholder="Téléphone"></div>
          <div class="col-md-3"><label class="form-label">Rôle</label><select th:field="*{idRole}" class="form-select"><option value="">Tous les rôles</option><option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.libelle}"></option></select></div>
          <div class="col-md-3"><label class="form-label">Embauché du</label><input th:field="*{dateEmbaucheDebut}" type="date" class="form-control"></div>
          <div class="col-md-3"><label class="form-label">Embauché au</label><input th:field="*{dateEmbaucheFin}" type="date" class="form-control"></div>
          <div class="col-md-3 d-flex gap-2"><button class="btn btn-secondary">Filtrer</button><a th:href="@{/personnels}" class="btn btn-outline-secondary">Tout</a></div>
        </form>
      </div></div>

      <!-- Tableau des résultats -->
      <div class="table-card mb-4">
        <table class="data-table">
          <thead>
            <tr>
              <th><a th:href="${@pageLinks.sortUrl(request, 'id')}">ID ↕</a></th>
              <th><a th:href="${@pageLinks.sortUrl(request, 'nom')}">Nom ↕</a></th>
              <th><a th:href="${@pageLinks.sortUrl(request, 'prenom')}">Prénom ↕</a></th>
              <th><a th:href="${@pageLinks.sortUrl(request, 'contact')}">Contact ↕</a></th>
              <th><a th:href="${@pageLinks.sortUrl(request, 'rolePersonnels.libelle')}">Rôle ↕</a></th>
              <th><a th:href="${@pageLinks.sortUrl(request, 'dateEmbauche')}">Date d'embauche ↕</a></th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="p : ${page.content}">
              <td th:text="${p.id}">1</td>
              <td class="fw-bold" th:text="${p.nom}">Nom</td>
              <td th:text="${p.prenom != null ? p.prenom : '-'}">Prénom</td>
              <td th:text="${p.contact != null ? p.contact : '-'}">0320000000</td>
              <td>
                <span class="badge bg-info text-dark" 
                      th:text="${p.roleLibelle != null ? p.roleLibelle : (p.rolePersonnels != null ? p.rolePersonnels.libelle : 'N/A')}">
                  Rôle
                </span>
              </td>
              <td th:text="${p.dateEmbauche != null ? #temporals.format(p.dateEmbauche, 'dd/MM/yyyy') : '-'}">
                01/01/2024
              </td>
              <td class="actions text-center">
                <a th:href="@{/personnels/detail/{id}(id=${p.id})}" class="btn btn-secondary btn-sm" title="Fiche & Paie">
                  <i class="bi bi-person-badge"></i>
                </a>
                <a th:href="@{/personnels/edit/{id}(id=${p.id})}" class="btn btn-warning btn-sm" title="Modifier">
                  <i class="bi bi-pencil"></i> Modifier
                </a>
                <form th:action="@{/personnels/delete/{id}(id=${p.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Supprimer cet employé ?');">
                  <button type="submit" class="btn btn-danger btn-sm" title="Supprimer">
                    <i class="bi bi-trash"></i> Supprimer
                  </button>
                </form>
              </td>
            </tr>
            <tr th:if="${page == null or #lists.isEmpty(page.content)}">
              <td colspan="7" class="text-center text-muted py-4">Aucun employé trouvé.</td>
            </tr>
          </tbody>
        </table>
        <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
      </div>

    </div>
  </div>

</div>

<div th:replace="~{layout/footer :: footer}"></div>
<th:block th:replace="~{layout/scripts :: scripts}"></th:block>

</body>
</html>
