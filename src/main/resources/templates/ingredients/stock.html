<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:with="pageTitle='État Global des Stocks'">
<head th:replace="~{layout/head :: head(pageTitle=${pageTitle})}"></head>
<body>

<div class="app">
  <aside th:replace="~{layout/sidebar :: sidebar(activeMenu='stocks')}"></aside>

  <div class="main">
    <div th:replace="~{layout/navbar :: topbar(pageTitle=${pageTitle})}"></div>

    <div class="content">
      <div class="page-header">
        <div>
          <h2>État des Stocks</h2>
          <div class="breadcrumb">Accueil / <span>Stocks</span></div>
        </div>
        <a th:href="@{/ingredients}" class="btn btn-secondary">&larr; Retour aux Ingrédients</a>
      </div>

      <div th:replace="~{fragments/alerts :: flash}"></div>

      <div class="card mb-4 shadow-sm"><div class="card-body">
        <form th:action="@{/ingredients/stock}" th:object="${criteria}" method="get" class="row g-3 align-items-end">
          <div class="col-md-4"><label class="form-label">Ingrédient</label><input th:field="*{nom}" class="form-control" placeholder="Nom de l'ingrédient"></div>
          <div class="col-md-3"><label class="form-label">Catégorie</label><select th:field="*{idCategorie}" class="form-select"><option value="">Toutes les catégories</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.libelle}"></option></select></div>
          <div class="col-md-3"><label class="form-label">Unité</label><select th:field="*{idUnite}" class="form-select"><option value="">Toutes les unités</option><option th:each="u : ${unites}" th:value="${u.id}" th:text="${u.nom}"></option></select></div>
          <div class="col-md-2 d-flex gap-2"><button class="btn btn-secondary">Appliquer</button><a th:href="@{/ingredients/stock}" class="btn btn-outline-secondary">Tout</a></div>
        </form>
      </div></div>

      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-header">
            <div class="kpi-label">Stock Correct</div>
            <div class="kpi-icon bg-green">
              <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
          </div>
          <div class="kpi-value" th:text="${nombreStockOk}">0</div>
          <div class="kpi-delta up">Quantité ≥ seuil</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-header">
            <div class="kpi-label">Alerte Stock Faible</div>
            <div class="kpi-icon bg-amber">
              <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
          </div>
          <div class="kpi-value" th:text="${nombreAlerteStock}">0</div>
          <div class="kpi-delta down"
               th:text="'Sous le seuil (' + ${seuilStockFaible} + ')'">Sous le seuil</div>
        </div>
      </div>

      <div class="table-card mb-4">
        <table class="data-table">
          <thead>
            <tr>
              <th><a th:href="${@pageLinks.sortUrl(request, 'nom')}">Ingrédient ↕</a></th>
              <th><a th:href="${@pageLinks.sortUrl(request, 'categorieIngredients.libelle')}">Catégorie ↕</a></th>
              <th>Quantité</th>
              <th><a th:href="${@pageLinks.sortUrl(request, 'unite.nom')}">Unité ↕</a></th>
              <th>Statut</th>
              <th class="text-center">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="item : ${page.content}">
              <td class="fw-bold" th:text="${item.ingredient.nom}">Nom</td>
              <td th:text="${item.ingredient.categorieIngredients != null ? item.ingredient.categorieIngredients.libelle : '-'}">Cat</td>
              <td th:text="${item.quantiteActuelle}">0</td>
              <td th:text="${item.ingredient.unite != null ? item.ingredient.unite.symbole : '-'}">kg</td>
              <td>
                <span th:if="${item.quantiteActuelle &lt; seuilStockFaible}" class="badge bg-danger">Alerte Faible</span>
                <span th:if="${item.quantiteActuelle &gt;= seuilStockFaible}" class="badge bg-success">En Stock</span>
              </td>
              <td class="actions text-center">
                <a th:href="@{/ingredients/{id}/detail(id=${item.ingredient.id})}" class="btn btn-primary btn-sm">
                  Mouvement
                </a>
              </td>
            </tr>
            <tr th:if="${page == null or #lists.isEmpty(page.content)}">
              <td colspan="6" class="text-center text-muted py-4">Aucun stock disponible.</td>
            </tr>
          </tbody>
        </table>
        <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
<th:block th:replace="~{layout/scripts :: scripts}"></th:block>
</body>
</html>
