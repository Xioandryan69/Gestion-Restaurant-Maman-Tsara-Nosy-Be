<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:with="pageTitle=${ 'Liste des ingredients'}">
<head th:replace="~{layout/head :: head(pageTitle=${pageTitle})}"></head>
<body>

    <div class="app">
        <aside th:replace="~{layout/sidebar :: sidebar(activeMenu='ingredients')}"></aside>
        <div class="main">
        <!-- Topbar globale -->
            <div th:replace="~{fragments/layout :: topbar('Gestion de la Caisse')}"></div>
                <div class="content">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2>Ingrédients</h2>
                        <div>
                            <a th:href="@{/ingredients/stock}" class="btn btn-outline-info me-2">État du Stock</a>
                            <a th:href="@{/ingredients/new}" class="btn btn-primary">+ Nouvel Ingrédient</a>
                        </div>
                    </div>
                    <div th:replace="~{fragments/alerts :: flash}"></div>

                    <!-- Formulaire de recherche / filtrage -->
                    <div class="card mb-4 shadow-sm">
                        <div class="card-body">
                            <form th:action="@{/ingredients}" method="get" th:object="${criteria}" class="row g-3">
                                <div class="col-md-4">
                                    <input type="text" th:field="*{nom}" class="form-control" placeholder="Nom de l'ingrédient...">
                                </div>
                                <div class="col-md-3">
                                    <select th:field="*{idCategorie}" class="form-select">
                                        <option value="">-- Categorie --</option>
                                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.libelle}"></option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <select th:field="*{idStatut}" class="form-select">
                                        <option value="">-- Statut --</option>
                                        <option th:each="st : ${statuts}" th:value="${st.id}" th:text="${st.libelle}"></option>
                                    </select>
                                </div>
                                <div class="col-md-2 d-grid">
                                    <button type="submit" class="btn btn-secondary">Filtrer</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Table d'affichage -->
                    <div class="table-responsive bg-white shadow-sm rounded">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nom</th>
                                <th>Catégorie</th>
                                <th>Fournisseur</th>
                                <th>Unité</th>
                                <th>Statut</th>
                                <th class="text-end">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="ing : ${page.content}">
                                <td th:text="${ing.id}">1</td>
                                <td><strong th:text="${ing.nom}">Riz</strong></td>
                                <td th:text="${ing.categorieLibelle != null ? ing.categorieLibelle : '-'}">Céréales</td>
                                <td th:text="${ing.fournisseurNom != null ? ing.fournisseurNom : '-'}">Fournisseur A</td>
                                <td th:text="${ing.uniteNom != null ? ing.uniteNom + ' (' + ing.uniteSymbole + ')' : '-'}">Kg</td>
                                <td>
                                    <span class="badge bg-info" th:text="${ing.statutLibelle}">Disponible</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/ingredients/{id}/detail(id=${ing.id})}" class="btn btn-sm btn-outline-primary">Détail</a>
                                    <a th:href="@{/ingredients/edit/{id}(id=${ing.id})}" class="btn btn-sm btn-outline-warning">Éditer</a>
                                    <form th:action="@{/ingredients/delete/{id}(id=${ing.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('Supprimer cet ingrédient ?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${page == null or #lists.isEmpty(page.content)}">
                                <td colspan="7" class="text-center text-muted py-4">Aucun ingrédient trouvé.</td>
                            </tr>
                            </tbody>
                        </table>
                        <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>


<div th:replace="~{layout/footer :: footer}"></div>
<th:block th:replace="~{layout/scripts :: scripts}"></th:block>

</body>
</html>
