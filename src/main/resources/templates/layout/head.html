<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle != null ? pageTitle + ' — Maman Tsara Nosy-Be' : 'Maman Tsara Nosy-Be'}">Gestion Restaurant</title>

    <!-- ===== CSS LOCAUX ===== -->
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}" />

    <!-- Font Awesome CSS -->
    <link rel="stylesheet" th:href="@{/font-awesome/css/all.min.css}" />

    <!-- Bootstrap Icons CSS -->
    <link rel="stylesheet" th:href="@{/bootstrap-icons/bootstrap-icons.css}" />

    <!-- Ton style personnalisé (doit être après les autres pour surcharger) -->
    <link rel="stylesheet" th:href="@{/css/style.css}" />

    <!-- Style personnalisé supplémentaire pour ajuster les détails -->
    <style>
        /* Ajustements d'ergonomie mobile */
        body {
            overflow-x: hidden; /* Évite les défilements horizontaux indésirables */
        }
        
        /* Rend toutes les tables défilables sur petits écrans */
        .table-responsive-mobile {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Adaptation du conteneur principal */
        @media (max-width: 768px) {
            .container, .container-fluid {
                padding-left: 10px;
                padding-right: 10px;
            }
            .btn {
                width: 100%; /* Boutons en largeur complète sur mobile */
                margin-bottom: 5px;
            }
        }
    </style>
</head>
