<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<body>

<aside th:fragment="sidebar(activeMenu)" class="sidebar" id="globalSidebar">
  
  <!-- CSS Intégré pour la Sidebar Responsive -->
  <style>
    /* Styles généraux de la sidebar */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background-color: #1e293b;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: sticky;
      top: 0;
      z-index: 1040;
      transition: transform 0.3s ease-in-out;
      overflow-y: auto;
    }

    .sidebar-brand {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #334155;
    }

    .logo-icon {
      background: #3b82f6;
      color: white;
      padding: 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-name {
      font-weight: 700;
      font-size: 1.1rem;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .sidebar-section {
      padding: 16px 20px 8px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      font-weight: 600;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .nav-item:hover, .nav-item.active {
      background-color: #334155;
      color: #ffffff;
      border-left: 4px solid #3b82f6;
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding: 16px 20px;
      border-top: 1px solid #334155;
      background: #0f172a;
    }

    .user-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #3b82f6;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .user-info .name {
      font-size: 0.85rem;
      font-weight: 600;
      color: #f8fafc;
    }

    .user-info .role {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    /* Bouton Hamburger pour mobile */
    .sidebar-toggle-btn {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 1050;
      background: #1e293b;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1030;
    }

    /* Adaptation Mobile (écrans < 768px) */
    @media (max-width: 767.98px) {
      .sidebar {
        position: fixed;
        transform: translateX(-100%);
      }

      .sidebar.show {
        transform: translateX(0);
      }

      .sidebar-toggle-btn {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .sidebar-overlay.show {
        display: block;
      }
    }
  </style>

  <!-- Bouton Toggle Mobile -->
  <button type="button" class="sidebar-toggle-btn" id="sidebarToggle" aria-label="Toggle Navigation">
    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <!-- Overlay d'arrière-plan Mobile -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- En-tête de la Sidebar -->
  <div class="sidebar-brand">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <div>
      <div class="brand-name">Maman Tsara</div>
      <div class="brand-sub">Nosy Be</div>
    </div>
  </div>

  <div class="sidebar-section">Navigation</div>
  <a th:href="@{/dashboard}" class="nav-item" th:classappend="${activeMenu == 'dashboard'} ? 'active'">
    <svg viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
    Tableau de bord
  </a>

  <div class="sidebar-section">Gestion Restaurant</div>
  <a th:href="@{/commandes}" class="nav-item" th:classappend="${activeMenu == 'commandes'} ? 'active'">
    <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Commandes
  </a>
  <a th:href="@{/plats}" class="nav-item" th:classappend="${activeMenu == 'plats'} ? 'active'">
    <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    Plats &amp; Menus
  </a>
  <a th:href="@{/ingredients}" class="nav-item" th:classappend="${activeMenu == 'ingredients'} ? 'active'">
    <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    Ingrédients
  </a>
  <a th:href="@{/stocks}" class="nav-item" th:classappend="${activeMenu == 'stocks'} ? 'active'">
    <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Stocks
  </a>
  <a th:href="@{/materielles}" class="nav-item" th:classappend="${activeMenu == 'materielles'} ? 'active'">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6v6H9z"/></svg>
    Matériels
  </a>
  <a th:href="@{/caisse}" class="nav-item" th:classappend="${activeMenu == 'caisse'} ? 'active'">
    <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
    Caisse
  </a>

  <div class="sidebar-section">Acteurs</div>
  <a th:href="@{/clients}" class="nav-item" th:classappend="${activeMenu == 'clients'} ? 'active'">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
    Clients
  </a>
  <a th:href="@{/fournisseurs}" class="nav-item" th:classappend="${activeMenu == 'fournisseurs'} ? 'active'">
    <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
    Fournisseurs
  </a>
  <a th:href="@{/personnels}" class="nav-item" th:classappend="${activeMenu == 'personnels'} ? 'active'">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
    Personnels
  </a>
  <a th:href="@{/zones-livraison}" class="nav-item" th:classappend="${activeMenu == 'zones-livraison'} ? 'active'">
    <svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13" rx="2" ry="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
    Zones de Livraison
  </a>

  <div class="sidebar-bottom">
    <div class="user-row">
      <div class="avatar">AD</div>
      <div class="user-info">
        <div class="name">Admin</div>
        <div class="role">Gestionnaire</div>
      </div>
    </div>
  </div>

  <!-- Script interactif d'ouverture/fermeture mobile -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const toggleBtn = document.getElementById("sidebarToggle");
      const sidebar = document.getElementById("globalSidebar");
      const overlay = document.getElementById("sidebarOverlay");

      function toggleMenu() {
        sidebar.classList.toggle("show");
        overlay.classList.toggle("show");
      }

      if (toggleBtn && sidebar && overlay) {
        toggleBtn.addEventListener("click", toggleMenu);
        overlay.addEventListener("click", toggleMenu);
      }
    });
  </script>

</aside>

</body>
</html>
