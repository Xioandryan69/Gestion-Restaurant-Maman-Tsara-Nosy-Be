<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head(pageTitle='Tableau de bord')}"></head>
<body>

<div class="app">
  <aside th:replace="~{layout/sidebar :: sidebar(activeMenu='dashboard')}"></aside>

  <div class="main">
    <div th:replace="~{layout/navbar :: topbar(pageTitle='Tableau de bord')}"></div>

    <div class="content">

      <div class="page-header">
        <div>
          <h2>Tableau de bord</h2>
          <div class="breadcrumb">Accueil / <span>Tableau de bord</span></div>
        </div>
      </div>

      <!-- KPIs Dynamiques alimentés par DashboardController -->
      <div class="kpi-grid">

        <div class="kpi-card">
          <div class="kpi-header">
            <div class="kpi-label">Total Commandes</div>
            <div class="kpi-icon bg-blue">
              <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            </div>
          </div>
          <div class="kpi-value" th:text="${totalCommandes}">0</div>
          <div class="kpi-delta up">Commandes enregistrées</div>
        </div>

        <div class="kpi-card">
          <div class="kpi-header">
            <div class="kpi-label">Total Clients</div>
            <div class="kpi-icon bg-green">
              <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
          </div>
          <div class="kpi-value" th:text="${totalClients}">0</div>
          <div class="kpi-delta up">Clients inscrits</div>
        </div>

        <div class="kpi-card">
          <div class="kpi-header">
            <div class="kpi-label">Ingrédients</div>
            <div class="kpi-icon bg-amber">
              <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </div>
          </div>
          <div class="kpi-value" th:text="${totalIngredients}">0</div>
          <div class="kpi-delta up">Références stock</div>
        </div>

        <div class="kpi-card">
          <div class="kpi-header">
            <div class="kpi-label">Personnels</div>
            <div class="kpi-icon bg-red">
              <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            </div>
          </div>
          <div class="kpi-value" th:text="${totalPersonnels}">0</div>
          <div class="kpi-delta up">Employés actifs</div>
        </div>

      </div>

    </div>
  </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
<th:block th:replace="~{layout/scripts :: scripts}"></th:block>

<!-- Dashboard charts -->
<div class="container mt-4">
  <div class="row">
    <div class="col-md-6">
      <h5>Achats Materielles (Plage)</h5>
      <div class="form-inline mb-2">
        <label class="me-2">Début:</label>
        <input type="date" id="materielle-debut" class="form-control me-2" />
        <label class="me-2">Fin:</label>
        <input type="date" id="materielle-fin" class="form-control me-2" />
        <label class="me-2">Variable:</label>
        <select id="materielle-variable" class="form-select me-2" style="width:auto; display:inline-block;">
          <option value="achats" selected>Achats</option>
          <option value="maintenances">Maintenances</option>
        </select>
        <button id="materielle-apply" class="btn btn-primary">Afficher</button>
      </div>
      <canvas id="materielleRangeChart" width="400" height="200"></canvas>
    </div>
    <div class="col-md-6">
      <h5>Caisse (Année)</h5>
      <canvas id="caisseYearPie" width="400" height="200"></canvas>
    </div>
  </div>
  <div class="row mt-3">
    <div class="col-md-6">
      <h5>Top ingrédients - Entrées/Sorties (Année)</h5>
      <canvas id="ingredientsYearChart" width="400" height="200"></canvas>
    </div>
    <div class="col-md-6">
      <h5>Plat - Coût d'achat</h5>
      <canvas id="platCostChart" width="400" height="200"></canvas>
    </div>
  </div>
</div>

<script>
  // Example initial rendering calls (user may override dates/year)
  document.addEventListener('DOMContentLoaded', function(){
    // materielle: use last 30 days by default
    const end = new Date().toISOString().slice(0,10);
    const start = new Date(Date.now()-30*24*60*60*1000).toISOString().slice(0,10);
    if(typeof renderMaterielleRangeChart === 'function') renderMaterielleRangeChart('materielleRangeChart', start, end);
    if(typeof renderCaisseYearPie === 'function') renderCaisseYearPie('caisseYearPie', new Date().getFullYear());
    if(typeof renderIngredientsYearChart === 'function') renderIngredientsYearChart('ingredientsYearChart', new Date().getFullYear(), 10);
    // plat cost chart requires a plat id; leave blank for now
  });
</script>

</body>
</html>
