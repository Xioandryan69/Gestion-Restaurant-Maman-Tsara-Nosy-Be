<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:with="pageTitle=${materiel.id == null ? 'Nouveau Matériel' : 'Modifier Matériel'}">
<head th:replace="~{layout/head :: head(pageTitle=${pageTitle})}">
    <!-- Viewport pour l'adaptation mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="bg-light">

<!-- CSS d'adaptation responsive -->
<style>
    body, .app {
        overflow-x: hidden;
    }

    .app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }
    
    @media (min-width: 768px) {
        .app {
            flex-direction: row;
        }
        .main {
            flex: 1;
            min-width: 0;
        }
    }

    .content {
        padding: 15px;
    }
    @media (min-width: 768px) {
        .content {
            padding: 25px;
        }
    }

    /* Grille adaptative : 1 colonne mobile, 2 colonnes desktop */
    .form-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
        margin-bottom: 1rem;
    }
    @media (min-width: 768px) {
        .form-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    /* Adapter la barre d'actions sur petit écran */
    @media (max-width: 576px) {
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .toolbar .btn {
            width: 100%;
        }
    }
</style>

<div class="app container-fluid p-0">
  <!-- Sidebar globale -->
  <aside th:replace="~{layout/sidebar :: sidebar(activeMenu='materielles')}"></aside>

  <div class="main w-100">
    <!-- Topbar globale -->
    <div th:replace="~{layout/navbar :: topbar(pageTitle=${pageTitle})}"></div>

    <div class="content">
      <div class="page-header mb-4">
        <div>
          <h2 class="h3 mb-1" th:text="${materiel.id == null ? 'Ajouter un Matériel' : 'Modifier le Matériel'}"></h2>
          <div class="breadcrumb mb-0">Accueil / <a th:href="@{/materielles}">Matériels</a> / <span>Formulaire</span></div>
        </div>
      </div>

      <div class="form-card card shadow-sm p-3 p-md-4 mb-4">
        <form th:action="@{/materielles/save}" th:object="${materiel}" method="post">
          <input type="hidden" th:field="*{id}" />

          <!-- Ligne 1 : Nom & Date d'entrée -->
          <div class="form-grid">
            <div class="field-group">
              <label class="field-label form-label">Nom <span class="required text-danger">*</span></label>
              <input type="text" th:field="*{nom}" class="form-control" required placeholder="Ex: Four Micro-ondes..." />
            </div>
            <div class="field-group">
              <label class="field-label form-label">Date d'entrée <span class="required text-danger">*</span></label>
              <input type="date" th:field="*{dateEntree}" class="form-control" required />
            </div>
          </div>

          <!-- Ligne 2 : Catégorie & Statut -->
          <div class="form-grid">
            <div class="field-group">
              <label class="field-label form-label">Catégorie <span class="required text-danger">*</span></label>
              <!-- th:field="*{idCategorie}" -->
              <select th:field="*{idCategorie}" class="form-control form-select" required>
                <option value="">-- Sélectionner --</option>
                <option th:each="c : ${categories}" 
                        th:value="${c.id}" 
                        th:text="${c.libelle}"
                        th:selected="${materiel.idCategorie != null and materiel.idCategorie == c.id}">
                </option>
              </select>
            </div>
            <div class="field-group">
              <label class="field-label form-label">Statut <span class="required text-danger">*</span></label>
              <!-- th:field="*{idStatut}" -->
              <select th:field="*{idStatut}" class="form-control form-select" required>
                <option value="">-- Sélectionner --</option>
                <option th:each="s : ${statuts}" 
                        th:value="${s.id}" 
                        th:text="${s.libelle}"
                        th:selected="${materiel.idStatut != null and materiel.idStatut == s.id}">
                </option>
              </select>
            </div>
          </div>

          <!-- Actions -->
          <div class="toolbar d-flex justify-content-end gap-2 mt-4">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a th:href="@{/materielles}" class="btn btn-secondary">Annuler</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
<th:block th:replace="~{layout/scripts :: scripts}"></th:block>

</body>
</html>
