<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:with="pageTitle=${client.id == null ? 'Ajouter un Client — Maman Tsara' : 'Modifier le Client — Maman Tsara'}">
<head th:replace="~{layout/head :: head(pageTitle=${pageTitle})}">
    <!-- Viewport pour l'affichage mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<!-- CSS d'adaptation responsive -->
<style>
    body, .app {
        overflow-x: hidden;
    }

    .app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }
    
    @media (min-width: 768px) {
        .app {
            flex-direction: row;
        }
        .main {
            flex: 1;
            min-width: 0;
        }
    }

    .content {
        padding: 15px;
    }
    @media (min-width: 768px) {
        .content {
            padding: 25px;
        }
    }

    /* Support de la grille du formulaire */
    .form-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
    }
    @media (min-width: 768px) {
        .form-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    /* Adaptabilité de la barre d'actions sur mobile */
    @media (max-width: 576px) {
        .toolbar {
            flex-direction: column-reverse;
            width: 100%;
        }
        .toolbar .btn {
            width: 100%;
        }
    }
</style>

<div class="app container-fluid p-0">

  <!-- Sidebar globale avec l'onglet 'clients' actif -->
  <aside th:replace="~{layout/sidebar :: sidebar(activeMenu='clients')}"></aside>

  <!-- Conteneur principal -->
  <div class="main w-100">

    <!-- Topbar globale -->
    <div th:replace="~{layout/navbar :: topbar(pageTitle=${pageTitle})}"></div>

    <!-- Contenu de la page -->
    <div class="content">

      <!-- En-tête de la page -->
      <div class="page-header d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
        <div>
          <h2 th:text="${client.id == null ? 'Ajouter un Client' : 'Modifier le Client'}" class="h3 mb-1">Client</h2>
          <div class="breadcrumb mb-0">
            Accueil / <a th:href="@{/clients}">Clients</a> / 
            <span th:text="${client.id == null ? 'Nouveau' : 'Édition'}">Formulaire</span>
          </div>
        </div>
        <div>
          <a th:href="@{/clients}" class="btn btn-secondary btn-sm w-100 w-sm-auto">&larr; Retour à la liste</a>
        </div>
      </div>

      <!-- Formulaire de saisie -->
      <form th:action="@{/clients/save}" th:object="${client}" method="post" id="clientForm">
        <input type="hidden" th:field="*{id}" />

        <div class="form-card card shadow-sm p-3 p-md-4 mb-4">
          <h3 class="text-primary h5 mb-3">Informations du Client</h3>

          <div class="form-grid">
            
            <div class="field-group">
              <label for="nom" class="field-label form-label">Nom <span class="required text-danger">*</span></label>
              <input type="text" id="nom" th:field="*{nom}" required class="form-control" placeholder="Entrez le nom" />
            </div>

            <div class="field-group">
              <label for="prenom" class="field-label form-label">Prénom</label>
              <input type="text" id="prenom" th:field="*{prenom}" class="form-control" placeholder="Entrez le prénom" />
            </div>

            <div class="field-group">
              <label for="contact" class="field-label form-label">Contact <span class="required text-danger">*</span></label>
              <input type="text" id="contact" th:field="*{contact}" required class="form-control" placeholder="Téléphone ou email" />
            </div>

            <div class="field-group">
              <label for="typeClient" class="field-label form-label">Type de Client <span class="required text-danger">*</span></label>
              <select id="typeClient" th:field="*{idTypeClient}" required class="form-select form-control">
                <option value="">-- Sélectionner un type --</option>
                <option th:each="type : ${typesClient}" 
                        th:value="${type.id}" 
                        th:text="${type.libelle}">
                  Type
                </option>
              </select>
            </div>

          </div>
        </div>

        <!-- Barre d'actions -->
        <div class="toolbar d-flex justify-content-end gap-2 mb-4">
          <a th:href="@{/clients}" class="btn btn-secondary">Annuler</a>
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-circle"></i> Enregistrer
          </button>
        </div>

      </form>

    </div>
  </div>

</div>

<div th:replace="~{layout/footer :: footer}"></div>
<th:block th:replace="~{layout/scripts :: scripts}"></th:block>

</body>
</html>
